[build]
  publish = "pastanetilify"
  command = "node scripts/generate-netlify-index.js"

[build.environment]
  NODE_VERSION = "18"

# Configurações de email (configurar no painel do Netlify)
[build.environment]
  EMAIL_USER = "seu-email@gmail.com"
  EMAIL_PASS = "sua-senha-app"

# Redirecionamentos
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Configurações de função
[functions]
  directory = "netlify/functions"

# Configurações de formulários (opcional)
[forms]
  netlify = true