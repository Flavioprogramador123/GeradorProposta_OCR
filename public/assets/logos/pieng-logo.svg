<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="piengGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3366CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(51, 102, 204, 0.3)"/>
    </filter>
  </defs>
  
  <!-- Círculo principal com gradiente -->
  <circle cx="60" cy="60" r="60" fill="url(#piengGradient)" filter="url(#shadow)"/>
  
  <!-- Brilho interno -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Símbolo Pi (π) -->
  <text x="60" y="80" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="900" 
        fill="white" 
        text-anchor="middle" 
        style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3)">π</text>
</svg>