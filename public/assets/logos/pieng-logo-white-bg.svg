<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="piengGradientWhiteBG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3366CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowWhiteBG" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(51, 102, 204, 0.2)"/>
    </filter>
  </defs>
  
  <!-- Fundo branco circular com sombra sutil -->
  <circle cx="100" cy="100" r="95" fill="white" filter="url(#shadowWhiteBG)" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  
  <!-- Círculo principal com gradiente -->
  <circle cx="100" cy="100" r="75" fill="url(#piengGradientWhiteBG)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Brilho interno -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Símbolo Pi (π) -->
  <text x="100" y="120" 
        font-family="Arial, sans-serif" 
        font-size="60" 
        font-weight="900" 
        fill="white" 
        text-anchor="middle" 
        style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3)">π</text>
        
  <!-- Texto PIENG abaixo do círculo -->
  <text x="100" y="190" 
        font-family="Arial, sans-serif" 
        font-size="18" 
        font-weight="900" 
        fill="#3366CC" 
        text-anchor="middle" 
        style="letter-spacing: 3px;">PIENG</text>
</svg>