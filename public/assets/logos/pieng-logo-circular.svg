<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="piengGradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3366CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowMain" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(51, 102, 204, 0.4)"/>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Círculo principal com gradiente -->
  <circle cx="100" cy="100" r="90" fill="url(#piengGradientMain)" filter="url(#shadowMain)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Brilho interno sutil -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <!-- Símbolo Pi (π) -->
  <text x="100" y="130" 
        font-family="Arial, sans-serif" 
        font-size="80" 
        font-weight="900" 
        fill="white" 
        text-anchor="middle" 
        filter="url(#innerGlow)"
        style="text-shadow: 3px 3px 6px rgba(0,0,0,0.4)">π</text>
        
  <!-- Texto PIENG abaixo -->
  <text x="100" y="170" 
        font-family="Arial, sans-serif" 
        font-size="20" 
        font-weight="900" 
        fill="white" 
        text-anchor="middle" 
        style="text-shadow: 2px 2px 4px rgba(0,0,0,0.6); letter-spacing: 4px;">PIENG</text>
</svg>