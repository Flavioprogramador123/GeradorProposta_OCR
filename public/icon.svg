<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo gradiente laranja (PIENG) -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#grad1)"/>

  <!-- Sol (símbolo solar) -->
  <circle cx="256" cy="200" r="60" fill="#fff" opacity="0.95"/>

  <!-- Raios do sol -->
  <line x1="256" y1="100" x2="256" y2="130" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="270" x2="256" y2="300" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="336" y1="200" x2="306" y2="200" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="206" y1="200" x2="176" y2="200" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="310" y1="144" x2="288" y2="166" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="224" y1="234" x2="202" y2="256" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="310" y1="256" x2="288" y2="234" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="224" y1="166" x2="202" y2="144" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

  <!-- Painel solar (3 células) -->
  <rect x="150" y="320" width="70" height="100" fill="#1e40af" stroke="#fff" stroke-width="4" rx="4"/>
  <rect x="221" y="320" width="70" height="100" fill="#1e40af" stroke="#fff" stroke-width="4" rx="4"/>
  <rect x="292" y="320" width="70" height="100" fill="#1e40af" stroke="#fff" stroke-width="4" rx="4"/>

  <!-- Linhas do painel (grid) -->
  <line x1="150" y1="345" x2="220" y2="345" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="370" x2="220" y2="370" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="395" x2="220" y2="395" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <line x1="221" y1="345" x2="291" y2="345" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="221" y1="370" x2="291" y2="370" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="221" y1="395" x2="291" y2="395" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <line x1="292" y1="345" x2="362" y2="345" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="292" y1="370" x2="362" y2="370" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="292" y1="395" x2="362" y2="395" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <!-- Texto PIENG (simplificado) -->
  <text x="256" y="470" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle" opacity="0.95">PIENG</text>
</svg>
