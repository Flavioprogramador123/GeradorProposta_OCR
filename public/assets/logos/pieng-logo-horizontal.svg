<svg width="300" height="120" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="piengGradientHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3366CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowHoriz" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(51, 102, 204, 0.3)"/>
    </filter>
  </defs>
  
  <!-- Círculo da logo -->
  <circle cx="60" cy="60" r="50" fill="url(#piengGradientHoriz)" filter="url(#shadowHoriz)"/>
  
  <!-- Brilho interno -->
  <circle cx="60" cy="60" r="35" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Símbolo Pi (π) no círculo -->
  <text x="60" y="80" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="900" 
        fill="white" 
        text-anchor="middle" 
        style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3)">π</text>
        
  <!-- Texto PIENG horizontal -->
  <text x="140" y="50" 
        font-family="Arial, sans-serif" 
        font-size="36" 
        font-weight="900" 
        fill="#3366CC" 
        style="letter-spacing: 4px;">PIENG</text>
        
  <!-- Subtítulo -->
  <text x="140" y="75" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#666" 
        style="letter-spacing: 2px;">SOLUÇÕES ENERGÉTICAS</text>
        
  <!-- Anos de experiência -->
  <text x="140" y="95" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        font-weight="500" 
        fill="#999" 
        style="letter-spacing: 1px;">35+ anos de experiência</text>
</svg>