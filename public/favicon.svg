<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="piengGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3366CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fundo -->
  <circle cx="16" cy="16" r="15" fill="url(#piengGradient)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Sombra interna -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  
  <!-- Letra P estilizada -->
  <text x="16" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-shadow="0 1px 2px rgba(0,0,0,0.3)">P</text>
  
  <!-- Destaque superior -->
  <ellipse cx="16" cy="8" rx="8" ry="3" fill="rgba(255,255,255,0.2)"/>
</svg>