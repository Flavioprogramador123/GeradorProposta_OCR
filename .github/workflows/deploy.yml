name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - clean-main
  pull_request:
    branches:
      - main
      - clean-main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Job 1: Gerar dados atualizados
  generate-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔄 Generate clients data JSON
        run: node scripts/generate-clients-json.js

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: public/clientes-data.json
          retention-days: 1

  # Job 2: Deploy para Vercel (Production)
  deploy-production:
    runs-on: ubuntu-latest
    needs: generate-data
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/clean-main')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📥 Download generated data
        uses: actions/download-artifact@v4
        with:
          name: generated-data
          path: public/

      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: ✅ Verificar secrets configurados
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "❌ ERRO: VERCEL_TOKEN não configurado!"
            echo "👉 Configure os secrets em: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "Secrets necessários:"
            echo "- VERCEL_TOKEN"
            echo "- VERCEL_ORG_ID"
            echo "- VERCEL_PROJECT_ID"
            echo ""
            echo "Veja instruções completas em: DEPLOY-AUTOMATICO.md"
            exit 1
          fi
          echo "✅ VERCEL_TOKEN configurado"
          echo "✅ VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}"
          echo "✅ VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}"

      - name: 🔗 Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Job 3: Deploy para Vercel (Preview)
  deploy-preview:
    runs-on: ubuntu-latest
    needs: generate-data
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📥 Download generated data
        uses: actions/download-artifact@v4
        with:
          name: generated-data
          path: public/

      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: ✅ Verificar secrets configurados
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "❌ ERRO: VERCEL_TOKEN não configurado!"
            echo "👉 Configure os secrets em: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ Secrets configurados corretamente"

      - name: 🔗 Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Vercel Preview
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: 💬 Comment PR with Preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Deploy Preview pronto!\n\n✅ URL: ${{ steps.deploy.outputs.url }}\n\n_Gerado automaticamente pelo GitHub Actions_`
            })
